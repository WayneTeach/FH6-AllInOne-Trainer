name: .NET Core Desktop

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  publish:
    runs-on: windows-latest

    env:
      Solution_Name: your-solution-name
      Project_Path: your-project-path
      Publish_Output: publish-output

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore $env:Project_Path

      - name: Publish
        run: dotnet publish $env:Project_Path -c Release -r win-x64 --self-contained true -o $env:Publish_Output

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ${{ env.Publish_Output }}
